<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Mama 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
#lockScreen{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  backdrop-filter: blur(8px);
  background:rgba(255,240,245,0.7);
  z-index:9999;
}

/* Elegant card */
.lockCard{
  background:rgba(255,255,255,0.85);
  padding:30px 25px;
  border-radius:20px;
  text-align:center;
  width:280px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  backdrop-filter: blur(10px);
  animation:fadeIn 1s ease;
}

.lockCard h1{
  font-family:'Pacifico',cursive;
  margin-bottom:10px;
}

.lockCard p{
  font-size:14px;
  margin-bottom:20px;
}

/* Input */
.lockCard input{
  width:80%;
  padding:10px;
  border-radius:20px;
  border:1px solid #ffd6e0;
  outline:none;
  text-align:center;
  margin-bottom:15px;
}

/* Button */
.lockCard button{
  padding:10px 18px;
  border:none;
  border-radius:20px;
  background:linear-gradient(45deg,#ff8fab,#ffd700);
  color:white;
  cursor:pointer;
}

/* Soft fade animation */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

body{
  margin:0;
  font-family:'Quicksand',sans-serif;
  text-align:center;
  color:#7a4e57;
  overflow-y:auto;
  overflow-x:hidden;
  background-color:#fff0f5;
}

/* ADD THIS */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url('2.jpeg') no-repeat center/cover;
  opacity:0.6;
  z-index:-2;
}

#home.active{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.page{ display:none; }
.active{ display:block; }

h1,h2{ font-family:'Pacifico',cursive; }

button{
  padding:12px 20px;
  border:none;
  border-radius:25px;
  background:linear-gradient(45deg,#ff8fab,#ffd700);
  color:white;
  cursor:pointer;
  margin:10px;
}

/* Cake */
#cakeContainer{
  position:relative;
  width:220px;
  margin:30px auto;
}
#cake{
  width:100%; /* ← CAKE IMAGE HERE */
}
#flame{
  position:absolute;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
  width:20px;
  height:30px;
  background:gold;
  border-radius:50%;
  animation:flicker .2s infinite;
}
@keyframes flicker{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.2);}
  100%{transform:translateX(-50%) scale(1);}
}

.polaroid{
  background:white;
  padding:10px 10px 25px;
  border-radius:10px;
  box-shadow:0 8px 15px rgba(0,0,0,0.15);
  transform:rotate(calc(-3deg + 6deg * random()));
}

/* fix random rotation (JS will handle instead) */
.polaroid:nth-child(even){ transform: rotate(2deg); }
.polaroid:nth-child(odd){ transform: rotate(-2deg); }

.polaroid img{
  width:100%;
  border-radius:8px;
  cursor:pointer;
}

/* Photo */
#photo{
  width:260px;
  border-radius:20px;
}

.gallery{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:15px;
  max-width:500px;
  margin:20px auto;
}

html, body{
  height:auto;
  min-height:100%;
}

/* photos */
.photoItem{
  width:100%;
  border-radius:15px;
  opacity:0;
  transform: translateY(30px) scale(0.9);
  transition: all 0.6s ease;
}

/* animation active */
.photoItem.show{
  opacity:1;
  transform: translateY(0) scale(1);
}

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;

  opacity:0;
  pointer-events:none;
  transition: opacity 0.4s ease;
}

#lightbox.active{
  opacity:1;
  pointer-events:auto;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;

  transform: scale(0.9);
  opacity:0;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

#lightbox.active img{
  transform: scale(1);
  opacity:1;
}

/* Final center */
#finalPage{
  display:none; /* important */
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
  font-family:'Pacifico',cursive;
}

#finalPage.active{
  display:flex; /* only show when active */
}

.achievementPhotos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin:20px;
  flex-wrap:wrap; /* mobile friendly */
}

.achievementPhotos img{
  width:clamp(160px, 30vw, 260px);
  border-radius:14px;
  box-shadow:0 6px 12px rgba(0,0,0,0.2);
}

/* Sparkles */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* Fireworks */
.firework{
  position:fixed;
  width:6px;
  height:6px;
  border-radius:50%;
  background:gold;
  animation:explode 1s ease-out forwards;
}
@keyframes explode{
  to{
    transform:translate(var(--x),var(--y));
    opacity:0;
  }
}
</style>
</head>

<body>
<div id="lockScreen">
  <div class="lockCard">
    <h1>Untuk Mama 💖</h1>
    <p>Masukkan Password</p>

    <input type="password" id="pw" placeholder="••••••">
    <button onclick="checkPassword()">Masuk</button>
  </div>
</div>

<!-- 🎵 MUSIC (PUT YOUR SONG FILE HERE) -->
<audio id="bgMusic" loop>
  <source src="birthday.mp3" type="audio/mpeg">
</audio>

<canvas id="sparkles"></canvas>

<!-- PAGE 1 -->
<div id="home" class="page active">
<h1>💝 Ada kejutan untuk Mama 💝</h1>
<h2>Mau lihat? 👀✨</h2>
<h3>🎁⸜(｡˃ ᵕ ˂｡)⸝🎁</h3>

<button onclick="goAchievement()">Ya 💕</button>
<button onclick="goNo()">Tidak</button>


</div>

<!-- NO -->
<div id="noPage" class="page">
<h1>⚠️ Error terdeteksi</h1>
<p>Silakan coba lagi</p>
<button onclick="goHome()">Coba Lagi</button>
</div>

<div id="achievementPage" class="page">
  <h1>Selamat atas Pencapaian Barunya 🎉</h1>

  <div class="achievementPhotos">
    <img src="2000.jpeg">
    <img src="2002.jpeg">
  </div>

  <button onclick="goCake()">Selanjutnya 🎂</button>
</div>

<!-- CAKE -->
<div id="cakePage" class="page">
<h1>Make A Wish 🎂</h1>

<div id="cakeContainer">
  <img id="cake" src="12.png"> <!-- ← PUT CAKE IMAGE HERE -->
  <div id="flame"></div>
</div>

<p>Tiup lilinnya 🕯️</p>
</div>

<!-- MESSAGE -->
<div id="messagePage" class="page">
<h1>💌 Untuk Mama</h1>
<p id="typedText" style="max-width:600px;margin:auto;line-height:1.6"></p>
<button onclick="goPhoto()">Selanjutnya 💕</button>
</div>

<!-- PHOTO -->
<div id="photoPage" class="page">
  <h1>˖˳·˖ ִֶָ ⋆༺📸༻⋆ ִֶָ˖·˳˖</h1>
  
<div class="gallery">
  <div class="polaroid"><img src="1001.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="1002.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="1003.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="1004.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="1005.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="1006.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="1007.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="1008.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="1009.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="10010.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="10011.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="10012.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="10013.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="10014.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="10015.jpeg" class="photoItem"></div>
  <div class="polaroid"><img src="10016.jpeg" class="photoItem"></div>
</div>

  <button onclick="finalPage()">Selanjutnya 💕</button>
</div>

<!-- FINAL -->
<div id="finalPage" class="page">
  <h1>I love you, Mama 💖</h1>
  <h2>Happiest birthday to you 🎉</h2>

  <button onclick="goHome()">Kembali 🏠</button>
</div>

<script>
function checkPassword(){
  const input = document.getElementById("pw").value;

  if(input === "Mama1965"){ // change this
    document.getElementById("lockScreen").style.display = "none";
  } else {
    alert("Password Salah 🥺");
  }
}

document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    checkPassword();
  }
});

function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function resetCandle(){
  const flame = document.getElementById('flame');
  if(flame){
    flame.style.display = 'block';
    flame.style.opacity = "1";
  }
}

function launchFireworks(){
  for(let i=0;i<40;i++){
    let f=document.createElement("div");
    f.className="firework";

    f.style.left=Math.random()*window.innerWidth+"px";
    f.style.top=Math.random()*window.innerHeight+"px";

    let angle=Math.random()*2*Math.PI;
    let dist=Math.random()*150;

    f.style.setProperty("--x",Math.cos(angle)*dist+"px");
    f.style.setProperty("--y",Math.sin(angle)*dist+"px");

    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1000);
  }
}

function goCake(){
  playMusic();
  show('cakePage');
  resetCandle(); // 🔥 always restore flame
}

function goNo(){ show('noPage'); }
function goHome(){
  show('home');

  // 🔥 restore candle flame
  const flame = document.getElementById('flame');
  if(flame){
    flame.style.display = 'block';
  }

  // optional: clear typed message
  const text = document.getElementById("typedText");
  if(text){
    text.innerHTML = "";
  }
}

function goAchievement(){
  show('achievementPage');
  launchFireworks(); // 🎆 trigger effect
}

function goPhoto(){
  show('photoPage');
  showPhotos();
}

function finalPage(){
  show('finalPage');

  launchFireworks();
  setTimeout(launchFireworks, 600);
  setTimeout(launchFireworks, 1200);
}

function showPhotos(){
  const photos = document.querySelectorAll(".photoItem");

  photos.forEach((img, index)=>{
    setTimeout(()=>{
      img.classList.add("show");
    }, index * 300); // delay between each photo
  });
}

/* Candle */
document.getElementById('cakeContainer').onclick=()=>{
  document.getElementById('flame').style.display='none';
  show('messagePage');
  typeMessage();
}

/* Typing effect */
const message = [
`SELAMAT ULANG TAHUN, MAMA 💖`,

`Terima kasih karena selalu sayang dan sabar menghadapi Cindy yang sering ngeselin dan keras kepala. Maaf atas sikap dan perkataan yang sering buat Mama sedih atau bahkan menangis`,

`Semoga Mama senantiasa diberikan kesehatan, umur yang panjang, kebahagiaan, kelancaran rezeki, senyuman, dan tawa. Semoga Mama bisa melakukan apapun yang Mama mau dan membuat Mama bahagia. Semoga kedepannya juga kita lebih banyak berbagi memori, tawa, dan kebahagiaan bersama ✨`,

`🤍 Makasih karena sudah jadi Mamanya Cindy 🤍`
];

function typeMessage(){
  let el = document.getElementById("typedText");
  el.innerHTML = "";
  let pIndex = 0;
  let charIndex = 0;

  function type(){
    if(pIndex < message.length){
      if(charIndex === 0){
        let p = document.createElement("p");
        el.appendChild(p);
      }

      let currentP = el.children[pIndex];
      currentP.innerHTML += message[pIndex].charAt(charIndex);
      charIndex++;

      if(charIndex < message[pIndex].length){
        setTimeout(type,20);
      } else {
        pIndex++;
        charIndex = 0;
        setTimeout(type,400);
      }
    }
  }
  type();
}

function goHome(){
  show('home');
  resetCandle();

  const text = document.getElementById("typedText");
  if(text){
    text.innerHTML = "";
  }
}

function playMusic(){
  const music = document.getElementById("bgMusic");
  music.play();
}

/* ✨ Sparkles */
const canvas=document.getElementById("sparkles");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let stars=Array.from({length:100}).map(()=>({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  size:Math.random()*2+1,
  speed:Math.random()*0.5+0.2
}));

function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  stars.forEach(s=>{
    ctx.fillStyle=Math.random()>0.5?"#ffd700":"#ffb6c1";
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    ctx.fill();

    s.y+=s.speed;
    if(s.y>canvas.height) s.y=0;
  });
}
setInterval(drawStars,30);


</script>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

</body>
</html>
